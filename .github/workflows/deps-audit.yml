name: Уязвимости зависимостей

# Отдельно от CI и по расписанию, а не на каждый PR: новая уязвимость в чужом
# пакете не имеет отношения к правке, и красный PR из-за неё сбивал бы с толку
# («ждём зелёный CI перед мёржем»). Упавший запланированный запуск GitHub
# присылает письмом. Исправление — поднять версию в requirements.txt отдельным PR.
permissions:
  contents: read

on:
  schedule:
    - cron: '17 6 * * 1'      # понедельник, 09:17 по Москве
  workflow_dispatch:

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверка requirements.txt по базе уязвимостей
        # PYSEC-2022-252 — взлом deep-translator в 2022 году: в базе у записи
        # открытый диапазон версий, и под неё попадают все выпуски настоящего
        # автора после 1.8.5. Ложная тревога, проверено вручную (октябрь 2026).
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --progress-spinner off --ignore-vuln PYSEC-2022-252
