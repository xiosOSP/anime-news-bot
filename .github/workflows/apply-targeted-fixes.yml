name: Apply targeted moderation and editorial fixes

on:
  push:
    branches:
      - fix/media-moderation-editorial-posts

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Bootstrap targeted moderation/editorial fix'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-moderation-editorial-posts
          fetch-depth: 0

      - name: Apply targeted source changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Telegram/editorial post quality: reject category-only headings and
          # promote the first factual sentence when a source/model returns one.
          replace_once(
              'anime_news_bot.py',
              "_TG_MEANINGFUL_RE = re.compile(r'[A-Za-zА-Яа-яЁё0-9]')\n",
              """_TG_MEANINGFUL_RE = re.compile(r'[A-Za-zА-Яа-яЁё0-9]')
_GENERIC_POST_TITLES = frozenset({
    'аниме', 'манга', 'манхва', 'маньхуа', 'ранобэ', 'ранобе',
    'новость', 'новости', 'анонс', 'трейлер', 'тизер', 'релиз',
    'игра', 'игры', 'кино', 'комикс', 'комиксы',
    'anime', 'manga', 'manhwa', 'manhua', 'news', 'announcement',
    'trailer', 'teaser', 'release', 'game', 'games', 'movie', 'comics',
})


def _is_generic_post_title(value: str) -> bool:
    normalized = re.sub(r'[^0-9a-zа-яё]+', ' ', str(value or '').casefold()).strip()
    return normalized in _GENERIC_POST_TITLES


def _promote_body_headline(value: str, max_len: int = 200) -> tuple[str, str]:
    \"\"\"Promote one complete factual sentence instead of a category-only heading.\"\"\"
    body = re.sub(r'\\s+', ' ', str(value or '')).strip()
    if not body:
        return '', ''
    parts = re.split(r'(?<=[.!?…])\\s+', body, maxsplit=1)
    first = parts[0].strip()
    rest = parts[1].strip() if len(parts) > 1 else ''
    if not 12 <= len(first) <= max_len:
        return '', body
    return first, rest
""",
              'generic title helpers')

          replace_once(
              'anime_news_bot.py',
              """    if not kept:
        return '', ''
    title = kept[0][:200]
    summary = ' '.join(kept[1:])[:1000] if len(kept) > 1 else ''
    return title, summary
""",
              """    if not kept:
        return '', ''
    if len(kept) > 1 and _is_generic_post_title(kept[0]):
        promoted, remainder = _promote_body_headline(' '.join(kept[1:]))
        if promoted:
            return promoted[:200], remainder[:1000]
    title = kept[0][:200]
    summary = ' '.join(kept[1:])[:1000] if len(kept) > 1 else ''
    return title, summary
""",
              'telegram generic heading fallback')

          replace_once(
              'anime_news_bot.py',
              """    new_title = str(data.get('title') or '').strip()
    new_summary = str(data.get('summary') or '').strip()

    # --- Текст: только если он адекватен ---
""",
              """    new_title = str(data.get('title') or '').strip()
    new_summary = str(data.get('summary') or '').strip()
    if _is_generic_post_title(new_title):
        promoted, remainder = _promote_body_headline(new_summary)
        if promoted:
            logger.info('LLM: рубричный заголовок %r заменён первой фактической фразой', new_title)
            new_title, new_summary = promoted, remainder
        else:
            logger.warning('LLM: отклонён пустой/рубrичный заголовок %r', new_title)
            new_title = ''

    # --- Текст: только если он адекватен ---
""".replace('рубrичный', 'рубричный'),
              'llm generic title guard')

          replace_once(
              'anime_news_bot.py',
              'и гик-культуре. Из сырой новости делаешь готовый пост.',
              ('и гик-культуре. Из сырой новости делаешь готовый пост. '
               'Заголовок должен быть самостоятельным: название произведения или события плюс то, что произошло. '
               'Никогда не используй в title одиночные рубрики вроде «Манга», «Аниме», «Новость», «Трейлер». '
               'Текст должен читаться как цельная короткая заметка: 1–3 связанных предложения без обрывков, '
               'канцелярита, фраз «напоминаем» и «стоит напомнить», повторов заголовка и дословных кальк. '
               'Не добавляй факты, которых нет в исходнике.'),
              'editorial prompt quality rules')

          replace_once(
              'anime_news_bot.py',
              "LLM_PROMPT_VERSION = _env('LLM_PROMPT_VERSION', 'editorial-v2-2026-08').strip() or 'editorial-v2-2026-08'",
              "LLM_PROMPT_VERSION = _env('LLM_PROMPT_VERSION', 'editorial-v3-2026-09').strip() or 'editorial-v3-2026-09'",
              'prompt cache version')

          # 2) Unchecked media: active moderation fails closed. We do not warn/mute
          # the author for an infrastructure failure, but the unverified media is
          # removed instead of being left visible in the chat.
          replace_once(
              'anime_news_bot.py',
              "    link = getattr(message, 'link', None)\n",
              """    removed = False
    if chat_moderation.mode == 'active':
        try:
            removed = bool(await bot.delete_message(chat_id=chat_id, message_id=message.message_id))
        except TelegramError as exc:
            logger.warning('Модерация: не удалось удалить непроверенное медиа %s/%s: %s',
                           chat_id, message.message_id, exc)
    link = getattr(message, 'link', None)
""",
              'fail-closed unchecked media')

          replace_once(
              'anime_news_bot.py',
              """            'Нужна ручная проверка; автоматический варн/мут за медиа не выдан.')
    if link:
""",
              """            'Нужна ручная проверка; автоматический варн/мут за медиа не выдан.')
    text += ('\\nСообщение удалено до ручной проверки.'
             if removed else '\\n⚠️ Не удалось удалить сообщение автоматически.')
    if link and not removed:
""",
              'unchecked media admin notice')

          # 3) Media scanner: queue concurrent checks instead of returning
          # "Локальная проверка занята", and avoid RLIMIT_AS native-runtime aborts.
          replace_once(
              'moderation_media.py',
              """        self._busy = False
        self._cache = OrderedDict()
""",
              """        self._scan_lock = asyncio.Lock()
        self._cache = OrderedDict()
""",
              'scanner lock init')

          replace_once(
              'moderation_media.py',
              """        if self._busy:
            return Scan('unchecked', reason='Локальная проверка занята')
        self._busy = True
        try:
            try:
""",
              """        async with self._scan_lock:
            # A previous queued scan may have filled the cache while we waited.
            cached = self._cache.get(key)
            if cached and cached[0] > time.monotonic():
                self._cache.move_to_end(key)
                return cached[1]
            try:
""",
              'scanner queue')

          replace_once(
              'moderation_media.py',
              """            return result
        finally:
            self._busy = False
""",
              """            return result
""",
              'scanner busy cleanup')

          replace_once(
              'moderation_media.py',
              """        resource.setrlimit(resource.RLIMIT_AS, (3 * 1024**3, 3 * 1024**3))
        resource.setrlimit(resource.RLIMIT_CPU, (50, 50))
""",
              """        # ONNX Runtime/OpenCV reserve large virtual address ranges. A low
        # RLIMIT_AS can abort a healthy native worker even when resident memory is
        # modest. File, pixel, frame and duration caps plus the supervisor timeout
        # already bound untrusted input; keep only the CPU limit here.
        resource.setrlimit(resource.RLIMIT_CPU, (50, 50))
""",
              'native worker address-space limit')

          replace_once(
              'moderation_media.py',
              "return Scan('unchecked', reason='Локальный детектор недоступен или завершился с ошибкой')",
              "return Scan('unchecked', reason=f'Локальный детектор аварийно завершился (код {result.returncode})')",
              'worker failure diagnostics')

          # Regression tests for both screenshots.
          replace_once(
              'tests/test_moderation_offline.py',
              "async def test_unchecked_media_is_visible_in_log_without_punishment(state):",
              "async def test_unchecked_media_is_removed_without_punishment(state):",
              'unchecked test name')
          replace_once(
              'tests/test_moderation_offline.py',
              """    assert state.recent_log()[0]['action'] == 'не проверено'
    telegram.delete_message.assert_not_awaited()
    assert state.warn_count(-100, 7) == 0
""",
              """    assert state.recent_log()[0]['action'] == 'не проверено'
    telegram.delete_message.assert_awaited_once()
    assert state.warn_count(-100, 7) == 0
""",
              'unchecked fail-closed assertion')

          replace_once(
              'tests/test_telegram_source.py',
              """    def test_http_fail_empty(self, monkeypatch):
""",
              """    def test_category_only_heading_is_promoted(self):
        title, summary = anime_news_bot._tg_title_and_summary(
            'Манга.\\n\\nKAGURABACHI был приостановлен из-за болезни автора и возобновится 27 сентября. '
            'Анонс адаптации остаётся в силе.',
            'testch', 'TG: Test')
        assert title.startswith('KAGURABACHI')
        assert title != 'Манга.'
        assert summary == 'Анонс адаптации остаётся в силе.'

    def test_http_fail_empty(self, monkeypatch):
