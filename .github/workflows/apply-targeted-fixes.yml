          PY

      - name: Determine Python version
        id: pyver
        shell: bash
        run: echo "version=$(tr -d ' \r' < runtime.txt | sed 's/^python-//')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          cache: pip

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Focused regression tests
        env:
          BOT_TOKEN: '123:ci-test-token'
          DATA_DIR: ${{ runner.temp }}/bot-data
        run: |
          python -m pyflakes anime_news_bot.py moderation_media.py tests/test_moderation_offline.py tests/test_telegram_source.py tests/test_llm.py
          python -m ruff check --select F821 anime_news_bot.py moderation_media.py
          python -m pytest -q tests/test_moderation_offline.py tests/test_telegram_source.py tests/test_llm.py

      - name: Refresh manifest
        run: python tools/build_manifest.py

      - name: Commit patched files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add anime_news_bot.py moderation_media.py tests/test_moderation_offline.py tests/test_telegram_source.py tests/test_llm.py BUILD_MANIFEST.json
          git commit -m "Fix media moderation and editorial post quality"
          git push origin HEAD:fix/media-moderation-editorial-posts
