name: CI

# Прогон на каждый push и PR. Отсутствие CI уже однажды стоило дорого:
# tools/check_invariants.py пропал из репозитория, весь тестовый набор падал
# на импорте, и заметить это было некому.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # runtime.txt — единственный источник правды о версии. Читаем его явно:
      # формат `python-3.11` предназначен для хостинга, и полагаться на то, что
      # setup-python его распознает, значит поставить CI в зависимость от
      # недокументированного поведения.
      - name: Определить версию Python из runtime.txt
        id: pyver
        run: echo "version=$(tr -d ' \r' < runtime.txt | sed 's/^python-//')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Синтаксис и мёртвый код
        run: python -m pyflakes anime_news_bot.py tools/*.py test_invariants.py tests/*.py

      - name: Тесты
        # BOT_TOKEN нужен только чтобы модуль импортировался; сеть не трогаем.
        # DATA_DIR уводим во временную папку, чтобы прогон не создавал файлов в репозитории.
        env:
          BOT_TOKEN: '123:ci-test-token'
          DATA_DIR: ${{ runner.temp }}/bot-data
        run: python -m pytest -q

      - name: Опись файлов совпадает с репозиторием
        run: python tools/build_manifest.py --check
