name: CI

# Прогон на каждый push и PR. Отсутствие CI уже однажды стоило дорого:
# tools/check_invariants.py пропал из репозитория, весь тестовый набор падал
# на импорте, и заметить это было некому.
# Токену CI нужно только чтение репозитория.
permissions:
  contents: read

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # runtime.txt — единственный источник правды о версии. Читаем его явно:
      # формат `python-3.11` предназначен для хостинга, и полагаться на то, что
      # setup-python его распознает, значит поставить CI в зависимость от
      # недокументированного поведения.
      - name: Определить версию Python из runtime.txt
        id: pyver
        run: echo "version=$(tr -d ' \r' < runtime.txt | sed 's/^python-//')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.pyver.outputs.version }}
          cache: pip

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Синтаксис и мёртвый код
        # Шаблон *.py, а не список: новый модуль иначе молча остаётся без проверки.
        run: python -m pyflakes *.py tools/*.py tests/*.py tests/e2e/*.py

      # F821 — обращение к несуществующему имени. Именно этот класс ошибок уже
      # ронял бота в проде, и тест на него есть; без инструмента он не работал.
      - name: Несуществующие имена
        run: python -m ruff check --select F821 *.py tools/*.py

      - name: Тесты
        # BOT_TOKEN нужен только чтобы модуль импортировался; сеть не трогаем.
        # DATA_DIR уводим во временную папку, чтобы прогон не создавал файлов в репозитории.
        env:
          BOT_TOKEN: '123:ci-test-token'
          DATA_DIR: ${{ runner.temp }}/bot-data
        run: python -m pytest -q

      - name: Опись файлов совпадает с репозиторием
        run: python tools/build_manifest.py --check

  # Хостинг может запустить бота на Python 3.10, даже если в runtime.txt 3.11.
  # Закреплённые numpy 2.4 и onnxruntime 1.29 на 3.10 не ставились: на сервере
  # развёртывание падало целиком, а CI на 3.11 оставался зелёным. Отдельная
  # задача (а не матрица), чтобы проверка «test» сохранила своё имя.
  test-python310:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      # Хостинг ставит requirements.txt раньше, чем копирует остальной код:
      # в папке установки нет ничего, кроме него самого.
      - name: Установка зависимостей так же, как на хостинге
        run: |
          python -m pip install --upgrade pip
          mkdir -p "$RUNNER_TEMP/hostbuild" && cp requirements.txt "$RUNNER_TEMP/hostbuild/"
          (cd "$RUNNER_TEMP/hostbuild" && pip install -r requirements.txt)
          pip install -r requirements-dev.txt

      - name: Тесты
        env:
          BOT_TOKEN: '123:ci-test-token'
          DATA_DIR: ${{ runner.temp }}/bot-data
        run: python -m pytest -q

  # Образ как на хостинге (Bothost): чистый python:3.x-slim, сначала только
  # requirements.txt, потом код. Ловит то, чего не видит ubuntu-раннер:
  # ссылки requirements.txt на соседние файлы (из-за «-c constraints.txt» не
  # деплоилась ни одна версия) и нехватку системных библиотек slim-образа для
  # opencv, onnxruntime, rlottie, ffmpeg и deno.
  hosting-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        image: ['python:3.11-slim', 'python:3.10-slim']
    name: hosting-image (${{ matrix.image }})
    steps:
      - uses: actions/checkout@v4

      - name: Сборка и проверка в образе хостинга
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm -e PYTHONDONTWRITEBYTECODE=1 -v "$PWD:/src:ro" "$IMAGE" bash -ec '
            mkdir /build && cp /src/requirements.txt /build/ && cd /build
            pip install --no-cache-dir -q -r requirements.txt
            cd /src && python tools/hosting_smoke.py'
