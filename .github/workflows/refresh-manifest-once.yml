name: Refresh manifest once

on:
  push:
    branches:
      - fix/media-moderation-editorial-posts

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'Refresh manifest after patch cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/media-moderation-editorial-posts
          fetch-depth: 0
      - name: Remove bootstrap workflow and refresh manifest
        run: |
          git rm .github/workflows/refresh-manifest-once.yml
          python tools/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BUILD_MANIFEST.json
          git commit -m "Refresh build manifest after cleanup"
          git push origin HEAD:fix/media-moderation-editorial-posts
